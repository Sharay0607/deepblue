spring:
  application:
    name: coursehub-persistence

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coursehub}
    username: ${DB_USERNAME:coursehub}
    password: ${DB_PASSWORD:coursehub}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    org.hibernate.SQL: INFO
